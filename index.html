<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY REKENING - Secure Payment</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-navy: #1a365d;
            --accent-gold: #d4af37;
            --accent-gold-light: #f4e4c1;
            --bg-light: #fafbfc;
            --bg-white: #ffffff;
            --text-dark: #1a202c;
            --text-gray: #718096;
            --border-light: #e2e8f0;
            --bri: #00529C;
            --nobu: #E31837;
            --ovo: #4C3494;
        }

        html, body {
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-light) 0%, #f5f7fa 100%);
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-navy) 0%, #2d5a8c 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(26, 54, 93, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: auto;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.1), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.08), transparent 50%);
            pointer-events: none;
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 4px;
            margin: 0;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        header h1 i {
            color: var(--accent-gold);
            font-size: 1.2em;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 18px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        header h1:hover i {
            background: rgba(212, 175, 55, 0.2);
            transform: scale(1.08);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.25);
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 300;
            position: relative;
            z-index: 1;
            margin-top: 8px;
            margin-bottom: 0;
        }

        /* Container */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        /* Payment Grid */
        .payment-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 60px;
        }

        @media (max-width: 1024px) {
            .payment-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }
        }

        /* Section Title */
        .section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: var(--primary-navy);
            margin-bottom: 35px;
            letter-spacing: 2px;
            font-weight: 600;
            position: relative;
            padding-bottom: 15px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-gold) 50%, transparent);
            border-radius: 2px;
        }

        .text-center .section-title::after {
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
        }

        /* Payment Card */
        .card {
            background: var(--bg-white);
            border: 2px solid var(--border-light);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            transition: all 0.4s ease;
        }

        .card.card-bri::before { background: linear-gradient(180deg, var(--bri), #004399); }
        .card.card-nobu::before { background: linear-gradient(180deg, var(--nobu), #c41534); }
        .card.card-ovo::before { background: linear-gradient(180deg, var(--ovo), #3d2970); }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            border-color: var(--accent-gold-light);
        }

        .card:hover .bank-name i {
            transform: scale(1.1);
        }

        /* Bank Name */
        .bank-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .bank-name i {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .card-bri .bank-name i { color: var(--bri); }
        .card-nobu .bank-name i { color: var(--nobu); }
        .card-ovo .bank-name i { color: var(--ovo); }

        .bank-name span {
            color: var(--text-dark);
            font-weight: 700;
        }

        /* Account Number */
        .acc-number {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin: 12px 0;
            color: var(--text-dark);
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
            transition: color 0.3s ease;
        }

        .card:hover .acc-number {
            color: var(--accent-gold);
        }

        /* Account Name */
        .acc-name {
            font-size: 0.85rem;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        /* Copy Button */
        .copy-btn {
            position: absolute;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, var(--primary-navy), #2d5a8c);
            border: 2px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 14px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(26, 54, 93, 0.2);
        }

        .copy-btn:hover {
            background: linear-gradient(135deg, var(--accent-gold), #e5c158);
            color: var(--primary-navy);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35);
        }

        .copy-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        @media (max-width: 640px) {
            .copy-btn {
                right: 15px;
                width: 44px;
                height: 44px;
                font-size: 1rem;
            }

            .card {
                padding: 20px;
                padding-right: 60px;
            }

            .acc-number {
                font-size: 1.3rem;
                letter-spacing: 2px;
            }
        }

        /* QRIS Container */
        .qris-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--bg-white);
            border: 2px solid var(--border-light);
            border-radius: 24px;
            padding: 45px 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
        }

        .qris-container::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .qris-container:hover {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            border-color: var(--accent-gold-light);
            transform: translateY(-5px);
        }

        /* QRIS Image */
        .qris-img-wrapper {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 30px;
            border: 3px solid var(--accent-gold-light);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.2);
            background: linear-gradient(135deg, #f9f7f4, #faf8f5);
            padding: 12px;
            position: relative;
            z-index: 1;
        }

        .qris-img-wrapper img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 12px;
            object-fit: cover;
        }

        .qris-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: var(--primary-navy);
            margin: 0;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .qris-subtitle {
            font-size: 0.9rem;
            color: var(--text-gray);
            text-align: center;
            letter-spacing: 1px;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }

        /* Footer */
        footer {
            background: var(--primary-navy);
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            padding: 30px 20px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            margin-top: auto;
        }

        footer a {
            color: var(--accent-gold);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.4);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast i {
            font-size: 1.1rem;
        }

        /* Responsive Typography */
        @media (max-width: 640px) {
            header {
                padding: 25px 20px;
            }

            header h1 {
                font-size: 2.2rem;
                gap: 12px;
                letter-spacing: 2px;
                margin: 0;
            }

            header h1 i {
                padding: 12px 14px;
                font-size: 1rem;
            }

            .header-subtitle {
                font-size: 0.8rem;
                margin-top: 6px;
            }

            .container {
                padding: 30px 20px;
            }

            .payment-grid {
                gap: 30px;
            }

            .section-title {
                font-size: 1.3rem;
                margin-bottom: 25px;
            }

            .card {
                margin-bottom: 20px;
                padding: 22px;
            }

            .bank-name {
                font-size: 1rem;
            }

            .qris-container {
                padding: 35px 20px;
            }

            .qris-img-wrapper {
                max-width: 250px;
                margin-bottom: 25px;
                border-width: 2px;
            }

            .qris-title {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 20px 15px;
            }

            header h1 {
                font-size: 1.8rem;
                letter-spacing: 1.5px;
                flex-direction: row;
                gap: 10px;
                margin: 0;
            }

            header h1 i {
                padding: 10px 12px;
                font-size: 0.9rem;
            }

            .header-subtitle {
                font-size: 0.75rem;
                letter-spacing: 1px;
                margin-top: 5px;
            }

            .container {
                padding: 25px 15px;
            }

            .section-title {
                font-size: 1.2rem;
            }

            .bank-name {
                gap: 8px;
                font-size: 0.95rem;
            }

            .acc-number {
                font-size: 1.2rem;
            }

            .qris-img-wrapper {
                max-width: 220px;
            }

            .qris-title {
                font-size: 1.3rem;
            }

            footer {
                font-size: 0.85rem;
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-wallet"></i> MY REKENING</h1>
    </header>

    <div class="container">
        <div class="payment-grid">
            <!-- Left Column: Bank Accounts -->
            <div class="bank-section">
                <div class="section-title">Transfer Options</div>

                <!-- BRI -->
                <div class="card card-bri">
                    <div class="bank-name"><i class="fa-solid fa-building-columns"></i> <span>Bank BRI</span></div>
                    <div class="acc-number" id="bri-acc">021601065472500</div>
                    <div class="acc-name">A.N. FARID ARIS</div>
                    <button class="copy-btn" onclick="copyToClipboard('bri-acc')" title="Salin Nomor"><i class="fa-regular fa-copy"></i></button>
                </div>

                <!-- Nobu -->
                <div class="card card-nobu">
                    <div class="bank-name"><i class="fa-solid fa-building-columns"></i> <span>Bank Nobu</span></div>
                    <div class="acc-number" id="nobu-acc">86100478833</div>
                    <div class="acc-name">A.N. FARID ARIS</div>
                    <button class="copy-btn" onclick="copyToClipboard('nobu-acc')" title="Salin Nomor"><i class="fa-regular fa-copy"></i></button>
                </div>

                <!-- OVO -->
                <div class="card card-ovo">
                    <div class="bank-name"><i class="fa-solid fa-wallet"></i> <span>OVO</span></div>
                    <div class="acc-number" id="ovo-acc">085825444030</div>
                    <div class="acc-name">A.N. FARID ARIS</div>
                    <button class="copy-btn" onclick="copyToClipboard('ovo-acc')" title="Salin Nomor"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>

            <!-- Right Column: QRIS -->
            <div class="qris-section">
                <div class="section-title">Quick Scan</div>
                <div class="qris-container">
                    <div class="qris-img-wrapper">
                        <img src="176101.png" alt="QRIS MY REKENING">
                    </div>
                    <h2 class="qris-title">NOURAPAY</h2>
                    <p class="qris-subtitle">Scan untuk pembayaran instan</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 FARID ARIS
    </footer>

    <!-- Notifikasi Salin -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i> Nomor berhasil disalin!
    </div>

    <script>
        function copyToClipboard(elementId) {
            var text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(function() {
                var toast = document.getElementById("toast");
                toast.classList.add("show");
                setTimeout(function(){ toast.classList.remove("show"); }, 3000);
            }, function(err) {
                console.error('Gagal menyalin: ', err);
            });
        }
    </script>

</body>
</html>
